name: hourly

# The whole pipeline, once an hour (docs/plans/2026-11-12-rebuild-design.md): fetch the news,
# and twice a day the official levels, the slower official pages and the media counts; label
# articles, match them to incidents, score and write the brief with Claude (Gemini and Groq as
# backup); publish under v2/ on the data branch, which the website reads.
# cron-job.org starts it each hour through workflow_dispatch on this file, so the file keeps
# the name collect.yml. GitHub's own schedule is a backup; a run that comes within 40 minutes
# of the last one does nothing.
on:
  schedule:
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      force_score:
        description: "Score the latest slot again and rewrite the brief"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# Shared with squash-data, so the two never write the data branch at once.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # GDELT's back-off can take minutes; labelling stops after 7
    steps:
      - uses: actions/checkout@v7

      - name: Check out the data branch into ./state
        uses: actions/checkout@v7
        with:
          ref: data
          path: state

      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag exists

      - run: uv sync --frozen --no-dev

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
          FORCE: ${{ inputs.force_score && '--force --force-score' || '' }}
        run: |
          uv run python -m monitor --state-dir state --git-sha "${{ github.sha }}" \
            --commit-msg-file "$RUNNER_TEMP/commit_msg.txt" $FORCE

      # Also after a failed run: what was fetched and labelled before the failure is kept.
      - name: Commit to the data branch
        if: always()
        working-directory: state
        run: |
          [ -f "$RUNNER_TEMP/commit_msg.txt" ] || { echo "The run wrote nothing"; exit 0; }
          $GITHUB_WORKSPACE/.github/scripts/commit_data.sh "$RUNNER_TEMP/commit_msg.txt"

      - name: Open or close the alert issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m monitor.alerts state "${{ job.status }}"
