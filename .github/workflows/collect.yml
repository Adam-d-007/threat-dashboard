name: collect

# Hourly RSS-only fetch into rss_buffer.json on the data branch, so items that scroll off
# shallow feeds between the twice-daily pipeline runs are not lost. Free on a public repo.
on:
  schedule:
    - cron: "35 * * * *" # half past, clear of the pipeline's :05 runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # GDELT back-off can take a few minutes
    steps:
      - uses: actions/checkout@v7

      - name: Check out the data branch into ./state
        uses: actions/checkout@v7
        with:
          ref: data
          path: state

      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag exists

      - run: uv sync --frozen --no-dev

      - name: Collect RSS items
        run: uv run python -m pipeline.collect --state-dir state --commit-msg-file "$RUNNER_TEMP/commit_msg.txt"

      - name: Commit to the data branch
        working-directory: state
        run: $GITHUB_WORKSPACE/.github/scripts/commit_data.sh "$RUNNER_TEMP/commit_msg.txt"
