name: compare-claude

# One-off (2026-11-21): cheaper Claude models against Claude Opus 5.5 on 48 real articles, to
# decide which labels. Reads the data branch, commits nothing, costs well
# under a dollar of the API credit. Delete after use.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Models to compare with opus_55 (comma-separated names from monitor/config.yaml)"
        default: "haiku_55"

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check out the data branch into ./state
        uses: actions/checkout@v7
        with:
          ref: data
          path: state

      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag exists

      - run: uv sync --frozen --no-dev

      - name: Compare
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: uv run python -m monitor.tools.compare_claude --state-dir state --models "$MODELS"
