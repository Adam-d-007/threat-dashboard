name: replay

# Temporary (rebuild step 3, docs/plans/2026-11-12-rebuild-design.md): sends the stories the
# old pipeline split into many incidents through the new labelling and matching. It only reads;
# it commits nothing. It runs when the replay itself changes on the rebuild branch, because a
# workflow that is not on the default branch cannot be started by hand. Delete after step 3.
on:
  push:
    branches: [rebuild]
    paths:
      - .github/workflows/replay.yml
      - monitor/tools/replay.py

permissions:
  contents: read

concurrency:
  group: replay
  cancel-in-progress: true

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check out the data branch into ./state
        uses: actions/checkout@v7
        with:
          ref: data
          path: state

      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag exists

      - run: uv sync --frozen --no-dev

      - name: Replay the split stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run python -m monitor.tools.replay --state-dir state
