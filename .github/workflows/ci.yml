name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag exists
      - run: uv sync --frozen
      - run: uv run ruff check pipeline
      - run: uv run pytest -q
      - name: Fixture run completes
        run: uv run python -m pipeline.main --fixtures --no-llm --state-dir "$RUNNER_TEMP/state"
      - name: JSON Schema is up to date
        run: |
          uv run python -m pipeline.tools.export_schema web/src/types/run.schema.json
          git diff --exit-code web/src/types/run.schema.json

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: TypeScript types match the schema
        run: |
          npm run gen:types
          git diff --exit-code src/types/run.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
