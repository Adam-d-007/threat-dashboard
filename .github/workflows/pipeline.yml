name: pipeline

on:
  schedule:
    - cron: "5 4,13 * * *" # 04:05 and 13:05 UTC; the offset avoids the top-of-hour peak
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Check out the data branch into ./state
        uses: actions/checkout@v7
        with:
          ref: data
          path: state

      - uses: astral-sh/setup-uv@v10

      - run: uv sync --frozen --no-dev

      - name: Run the pipeline
        run: |
          slot=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # A delayed scheduled run still gets its slot's id.
            if [ "$(date -u +%H)" -lt 13 ]; then slot="--slot 04"; else slot="--slot 13"; fi
          fi
          uv run python -m pipeline.main --state-dir state --git-sha "${{ github.sha }}" \
            --commit-msg-file "$RUNNER_TEMP/commit_msg.txt" $slot

      - name: Commit to the data branch
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/commit_msg.txt"
          git push origin HEAD:data
