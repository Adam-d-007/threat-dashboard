name: pipeline

on:
  schedule:
    - cron: "5 4,13 * * *" # 04:05 and 13:05 UTC; the offset avoids the top-of-hour peak
    # Backups: GitHub may delay or drop scheduled runs under load. A backup exits at once
    # when its slot already has a run (--skip-if-slot-done), so it never runs twice.
    - cron: "35 4,13 * * *"
    - cron: "5 5,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Check out the data branch into ./state
        uses: actions/checkout@v7
        with:
          ref: data
          path: state

      - uses: astral-sh/setup-uv@v10.3.0 # no floating major tag exists

      - run: uv sync --frozen --no-dev

      - name: Run the pipeline
        env:
          # Empty until Adam adds them; the acled source stays disabled until then.
          ACLED_EMAIL: ${{ secrets.ACLED_EMAIL }}
          ACLED_PASSWORD: ${{ secrets.ACLED_PASSWORD }}
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME }}
        run: |
          slot=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # A delayed or backup run still gets its slot's id, and skips a slot already done.
            if [ "$(date -u +%H)" -lt 13 ]; then slot="--slot 04"; else slot="--slot 13"; fi
            slot="$slot --skip-if-slot-done"
          fi
          uv run python -m pipeline.main --state-dir state --git-sha "${{ github.sha }}" \
            --commit-msg-file "$RUNNER_TEMP/commit_msg.txt" $slot

      - name: Commit to the data branch
        working-directory: state
        run: $GITHUB_WORKSPACE/.github/scripts/commit_data.sh "$RUNNER_TEMP/commit_msg.txt"
