# Source registry. Every URL here was found on the source's own site and
# fetched successfully on the date in verified_on. Never add a guessed URL.
#
# Fields:
#   id, name      stable id used in data files, display name
#   group         backbone | official | anchor | slovak_press | regional_press | eu_press | analysis | context
#   tier          A official body, B wire/quality outlet/institute, C GDELT aggregation only
#   adapter       module in pipeline/adapters
#   urls          one or more feed URLs (some entries bundle several feeds of one outlet)
#   lang          ISO 639-1 language of the feed
#   regions       SK and/or EU
#   enabled       false turns the source off; give the reason in notes
#   verified_on   date the URLs were last fetched and parsed successfully
#   notes         anything a maintainer needs to know
# Optional:
#   hourly        false keeps a source out of the hourly collector (default true for rss)
#   max_items     keep only the newest N items (feeds that carry their whole archive)
#   exclude_title regex; matching titles are dropped (e.g. paid advertisements)
#   html / json   selectors or field names for the html_scrape and json_api adapters
#
# Official threat levels are not sources: they live in anchors.yaml.

sources:
  - id: gdelt_doc
    name: GDELT DOC 2.0
    group: backbone
    tier: C
    adapter: gdelt_doc
    urls: ["https://api.gdeltproject.org/api/v2/doc/doc"]
    lang: multi
    regions: [SK, EU]
    enabled: true
    verified_on: 2026-10-22
    notes: >-
      Queries live in keywords.yaml. Max 1 request per 5 s. Slovakia is FIPS code LO.
      Answers HTTP 429 often from GitHub runners (shared IPs) and always from Adam's home
      connection; the adapter backs off 20, 40, 80 s.

  - id: tasr
    name: TASR (teraz.sk)
    group: slovak_press
    tier: B
    adapter: rss
    urls:
      - https://www.teraz.sk/rss/slovensko.rss
      - https://www.teraz.sk/rss/zahranicie.rss
    lang: sk
    regions: [SK, EU]
    enabled: true
    verified_on: 2026-10-22
    notes: >-
      teraz.sk is TASR's public news portal (tasr.sk itself publishes no feed). Each feed
      holds only the newest 15 items: on 2026-10-22 slovensko covered about 17 h and
      zahranicie about 3 h. The hourly collect workflow (rss_buffer.json) catches items
      that scroll off between pipeline runs.

