  - id: gdelt_gkg
    name: GDELT 2.0 GKG files
    group: backbone
    tier: C
    adapter: gdelt_gkg
    urls: ["https://data.gdeltproject.org/gdeltv2/lastupdate.txt"]
    lang: multi
    regions: [SK, EU]
    enabled: true
    verified_on: 2026-10-22
    gkg:
      max_hours: 16          # runs are at most 15 h apart; about 5 s per file
      themes: [TERROR, ARMEDCONFLICT, SECURITY_SERVICES, MILITARY, PROTEST, CYBER_ATTACK,
               KILL, ARREST, EXTREMISM, SURVEILLANCE, BORDER, REBELLION]
