# GDELT DOC 2.0 queries, and prefilter terms. The hourly collector runs the GDELT queries
# (3-hour windows), because GDELT rate-limits GitHub's shared servers and one attempt per
# twice-daily run failed in every run on 2026-10-22. All four were checked on that day.
gdelt_doc:
  queries:
    # GDELT has no "slovakia" country name: its lookup still labels Slovakia's FIPS code LO
    # as "Czechoslovakia" (data.gdeltproject.org/api/v2/guides/LOOKUP-COUNTRIES.TXT).
    - id: terror_sk_sources
      query: "theme:TERROR sourcecountry:LO"
    # Terrorism coverage from the neighbours' own media (FIPS: EZ Czechia, AU Austria,
    # HU Hungary, PL Poland, UP Ukraine).
    - id: terror_neighbours
      query: "theme:TERROR (sourcecountry:EZ OR sourcecountry:AU OR sourcecountry:HU OR sourcecountry:PL OR sourcecountry:UP)"
    # Terrorism coverage anywhere that mentions Slovakia.
    - id: terror_mentions_sk
      query: "theme:TERROR (Slovakia OR Slovak OR Bratislava OR Slovensko)"
    # Hybrid incidents over Europe.
    - id: hybrid_europe
      query: "(sabotage OR \"drone sighting\" OR \"airspace violation\") (Europe OR NATO OR EU)"

# Prefilter (pipeline/process/prefilter.py). An item is kept when its source group is in
# keep_groups, or its title or snippet contains one of these terms at the start of a word.
# Terms are word starts (stems), matched case-insensitively with diacritics removed, so
# "vybuch" also matches "výbuchu". A term ending in ! must match a whole word ("war!" does
# not match "warfarin"). The prefilter favours recall: the LLM decides relevance.
# Slovak and Czech lists reviewed by Adam on 2026-10-22.
prefilter:
  keep_groups: [official, backbone]
  max_items: 600
  terms:
    en: [terror, attack, bomb, explos, blast, shooting, gunman, gunmen, stabbing, knife attack,
         hostage, extremis, radicali, jihad, islamic state, isis, daesh, al-qaeda, hamas,
         hezbollah, sabotage, arson, drone, airspace, cyberattack, cyber attack, ransomware,
         hacker, disinformation, hybrid, espionage, spy!, spies!, spying, plot!, plots!, foiled,
         arrest, detain, suspect,
         militant, neo-nazi, far-right, far-left, anarchist, assassinat, security alert,
         threat level, evacuat, nato!, military, troops, missile, war!, wars!, ceasefire, sanction,
         invasion, front line, frontline, shelling, airstrike, mobilis, mobiliz]
    sk: [terori, utok, bomb, vybus, vybuch, strelb, strelec, nozom, rukojem, extremis,
         radikal, dzihad, islamsk, sabotaz, podpal, dron, vzdusn, kyberneticke, hacker,
         dezinform, hybridn, spion, zadrzal, zadrzan, obvinil, obvinen, atentat, hrozb,
         bezpecnost, armad, vojsk, vojak, raket, vojn, primeri, sankci, nato!, invazi, ostrel,
         mobiliz, naka, policajt, vrazd]
    cs: [terori, utok, bomb, vybus, vybuch, strelb, strelec, nozem, rukojm, extremis,
         radikal, dzihad, islamsk, sabotaz, zhar, dron, vzdusn, kyberneticke, hacker,
         dezinform, hybridni, spion, zadrzel, zadrzen, obvinil, obvinen, atentat, hrozb,
         bezpecnost, armad, vojsk, vojak, raket, valk, primeri, sankc, nato!, invaz, ostrel,
         mobiliz, vrazd]
    de: [terror, anschlag, bombe, sprengstoff, explosion, schusse, schutze, messerangriff,
         messer, geisel, extremis, radikalis, dschihad, islamist, sabotage, brandanschlag,
         drohne, luftraum, cyberangriff, hacker, desinformation, hybrid, spion, festgenommen,
         festnahme, attentat, bedrohung, sicherheit, bundeswehr, rakete, krieg, waffenruhe,
         sanktion, nato!, invasion, front]
    hu: [terror, merenylet, tamad, bomba, robban, lovoldoz, kesel, tusz, szelsoseg,
         radikaliz, dzsihad, iszlam allam, szabotazs, gyujtogat, dron, legter, kibertamad,
         hacker, dezinformaci, hibrid, kem!, kemek!, orizetbe, letartoztat, fenyeget, biztonsag,
         raket, haboru, tuzszunet, szankci, nato!, hadsereg, katona]
    pl: [terror, zamach, atak, bomb, wybuch, strzelanin, nozem, zakladni, ekstremis,
         radykaliz, dzihad, panstwo islamskie, sabotaz, podpalen, dron, przestrzen powietrzn,
         cyberatak, haker, dezinformac, hybrydow, szpieg, zatrzyman, aresztowa, zagrozeni,
         bezpieczenst, rakiet, wojn, zawieszeni broni, sankcj, nato!, armi, zolnierz]
    fr: [terror, attentat, attaque, bombe, explosi, fusillade, tireur, couteau, otage,
         extremis, radicalis, djihad, etat islamique, sabotage, incendie criminel, drone,
