[project]
name = "threat-dashboard-pipeline"
version = "0.1.0"
description = "Data pipeline for the threat dashboard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.19",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[tool.ruff.lint.per-file-ignores]
# Tests carry inline XML and HTML samples.
"pipeline/tests/*" = ["E501"]
