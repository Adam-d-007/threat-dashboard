# Netlify reads this from the repository root, so no base directory has to be set in the UI.
# Production branch: main. Branch deploys: dev only (set in the Netlify UI).
# Production deploys cost 15 of the free plan's 300 monthly credits; keep them to 12 a month
# so the rest pays for traffic.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"
  # Skip the build (and the deploy) when nothing under web/ changed, apart from the generated
  # types and schema in src/types (type-only, erased at build) and the tests: the site is the
  # same.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)src/types' ':(exclude,glob)**/*.test.tsx' ':(exclude)src/test'"

# The dev branch deploy renders the bundled sample data (labelled on every page), so the design
# can be reviewed before scoring exists. Production always reads the real data branch.
[context.dev.environment]
  VITE_SAMPLE_DATA = "true"
